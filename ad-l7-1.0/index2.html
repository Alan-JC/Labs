<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>

  <!-- Task 5: Navbar -->
  <nav class="navbar sm:navbar-expand bg-1 fg-2">
    <div class="container">
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="navMenu" aria-labelledby="navMenuLabel">
        <div class="drawer-header">
          <h5 class="drawer-title" id="navMenuLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <div class="nav nav-pills navbar-nav">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" aria-current="page" href="index2.html">index2</a>
          </div>
        </div>
      </dialog>
    </div>
  </nav>

  <!-- Task 3: Grid -->
  <div class="container d-flex flex-column my-4">

    <!-- Task 2: Alert -->
    <div class="mb-3">
      <button type="button" class="btn btn-primary" id="theButton">The Button</button>
      <div id="alertArea" class="mt-3"></div>
    </div>

    <div class="row">
      <div class="col-2">the left side</div>
      <div class="col-8">the centre side</div>
      <div class="col-2">the right side</div>
    </div>

    <div class="row">
      <div class="col-12">Footer</div>
    </div>

    <!-- Task 4: Form -->
    <form class="mt-4">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

  </div>

  <!-- Task 1: script de Bootstrap al final del body -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

  <script>
    const area = document.getElementById('alertArea');

    document.getElementById('theButton').addEventListener('click', () => {
      area.insertAdjacentHTML('beforeend',
        `<div class="alert alert-danger alert-dismissible" role="alert">
           Alert, someone pushed the button
           <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
         </div>`);
    });

    // Respaldo: cierra la alerta al dar clic en la "x"
    area.addEventListener('click', (e) => {
      const close = e.target.closest('.btn-close');
      if (close) close.closest('.alert').remove();
    });
  </script>

</body>
</html>
